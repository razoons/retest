<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Really Simple Page</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0ea5e9">
  <link rel="icon" href="/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      margin: 2rem;
    }
  </style>
</head>

<body>
  <h1>Hello, world!</h1>
  <p>This is a super simple HTML page.</p>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const reg = await navigator.serviceWorker.register("/service-worker.js", { scope: "/" });
          // (optionnel) auto-update du SW
          setInterval(() => reg.update(), 60 * 60 * 1000); // toutes les heures

          // (optionnel) activer la nouvelle version immédiatement
          navigator.serviceWorker.addEventListener("controllerchange", () => {
            // tu peux rafraîchir l’UI ici si besoin
          });
        } catch (e) {
          console.error("SW registration failed", e);
        }
      });
    }

  </script>
</body>

</html>
